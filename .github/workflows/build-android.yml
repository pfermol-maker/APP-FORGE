name: APP FORGE — Build Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar proyecto
        run: |
          test -f project/index.html || (echo "Falta project/index.html" && exit 1)

      - name: Instalar dependencias
        run: npm install

      - name: Crear Android
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

            - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/APP-FORGE-Android.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APP-FORGE-Android
          path: dist/APP-FORGE-Android.apk
          if-no-files-found: error
